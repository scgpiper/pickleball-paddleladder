<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pickleball PaddleLadder</title>

<style>
body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f4f7fb;
  color:#10213b;
}

header{
  background:#0d2f63;
  color:#fff;
  padding:22px;
  text-align:center;
}

header h1{margin:0;font-size:28px}
header p{margin:6px 0 0}

main{
  max-width:850px;
  margin:auto;
  padding:18px;
}

.grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
}

button{
  border:0;
  border-radius:14px;
  padding:18px 10px;
  background:#1261c9;
  color:#fff;
  font-size:18px;
  font-weight:bold;
  cursor:pointer;
}

button:hover{background:#0d4fa8}

.challengeBtn,
.smallBtn{
  padding:9px 13px;
  font-size:14px;
  border-radius:9px;
}

.acceptBtn{background:#218739}
.acceptBtn:hover{background:#17672a}

.declineBtn,
.disputeBtn{background:#b42318}

.declineBtn:hover,
.disputeBtn:hover{background:#8e1c13}

.card{
  background:#fff;
  border:1px solid #dbe4ef;
  border-radius:14px;
  padding:16px;
  margin-top:16px;
}

table{
  width:100%;
  border-collapse:collapse;
}

th,td{
  padding:10px 6px;
  border-bottom:1px solid #edf1f6;
  text-align:left;
}

.top10{background:#fff9dc}
.myteam{outline:3px solid #1261c9}

.muted{
  color:#6b778c;
  font-size:13px;
}

.notice,
.success,
.warning{
  padding:12px;
  border-radius:10px;
  margin:12px 0;
}

.notice{background:#eaf3ff}
.success{background:#eaf8ee}
.warning{background:#fff3cd}

select,
input{
  padding:11px;
  border:1px solid #ccd6e2;
  border-radius:9px;
  font-size:16px;
  box-sizing:border-box;
}

select{
  width:100%;
  margin:8px 0 16px;
}

.scoreTable input{
  width:75px;
}

.actionRow{
  display:flex;
  gap:10px;
  flex-wrap:wrap;
  margin-top:14px;
}

@media(max-width:650px){
  .grid{grid-template-columns:1fr}
  th:nth-child(3),td:nth-child(3){display:none}
}
</style>
</head>

<body>

<header>
  <h1>Pickleball PaddleLadder</h1>
  <p>Challenge. Compete. Climb.</p>
</header>

<main>

<div class="grid">
  <button onclick="show('board')">🏆 Leaderboard</button>
  <button onclick="show('challenge')">⚔️ My Challenges</button>
  <button onclick="show('score')">✍️ Enter Score</button>
  <button onclick="show('rules')">❓ Rules / Help</button>
  <button onclick="show('partners')">🤝 Partner Connect</button>
</div>

<div id="content" class="card"></div>

</main>

<script>

let teams = [
  {name:"Baseline Bandits",players:"Adams / Brown",dupr:9.10,wins:8,losses:1},
  {name:"Kitchen Kings",players:"Carter / Davis",dupr:8.95,wins:7,losses:2},
  {name:"Third Shot Crew",players:"Evans / Foster",dupr:8.72,wins:6,losses:2},
  {name:"Dink Dynasty",players:"Green / Harris",dupr:8.55,wins:6,losses:3},
  {name:"Paddle Pressure",players:"Owens / Parker",dupr:7.91,wins:5,losses:4},
  {name:"Court Commanders",players:"Irwin / Jones",dupr:8.38,wins:5,losses:4},
  {name:"Side Out",players:"King / Lewis",dupr:8.20,wins:5,losses:4},
  {name:"No Man's Land",players:"Martin / Nelson",dupr:8.05,wins:4,losses:3},
  {name:"Court Rush",players:"Wilson / Young",dupr:7.51,wins:3,losses:3},
  {name:"Drop Shots",players:"Quinn / Roberts",dupr:7.80,wins:3,losses:4},
  {name:"The Challengers",players:"Underwood / Vance",dupr:7.56,wins:5,losses:2}
];
function placeNewTeamByDupr(){
  const newTeam = createdTeams[createdTeams.length - 1];

  if(!newTeam) return;

  // NR teams always enter at the bottom
  if(newTeam.isNR){
    teams.push(newTeam);
    return;
  }

  const newDupr = parseFloat(newTeam.dupr);
  let insertIndex = teams.length;

  // Position 11 is index 10.
  // A new team's DUPR can never place it inside the Top 10.
  for(let i = 10; i < teams.length; i++){
    const existingDupr = parseFloat(teams[i].dupr);

    if(!isNaN(existingDupr) && newDupr > existingDupr){
      insertIndex = i;
      break;
    }
  }

  teams.splice(insertIndex, 0, newTeam);
}
let myTeam = null;
 let partnerListings = [];
  let createdTeams = [];
  let partnerInvites = [];
let challenge = null;

function teamIndex(team){
  return teams.indexOf(team);
}

function show(page){

  if(page==="board") renderBoard();
  if(page==="challenge") renderChallenges();
  if(page==="score") renderScore();
  if(page==="partners") renderPartners();

  if(page==="rules"){
    document.getElementById("content").innerHTML=
      "<h2>Rules / Help</h2>"+
      "<p><b>Challenge:</b> A team may challenge up to 3 positions above.</p>"+
      "<p><b>Match:</b> Best 2 of 3 games to 11, win by 2.</p>"+
      "<p><b>Challenger wins:</b> Challenger takes the challenged team's position. Teams between them move down one position.</p>"+
      "<p><b>Challenged team wins:</b> Ladder positions do not change.</p>"+
      "<p><b>Results:</b> The opposing team must confirm the submitted result before standings change.</p>"+
      "<p><b>New teams:</b> Combined DUPR determines initial placement, but a new team cannot initially enter the Top 10.</p>";
  }
}

function renderBoard(){

  const c=document.getElementById("content");

  let options='<option value="">Choose your team...</option>';

  teams.forEach((team,i)=>{
    options +=
      '<option value="'+i+'" '+(team===myTeam?'selected':'')+'>'+
      '#'+(i+1)+' — '+team.name+
      '</option>';
  });

  let html=
    "<h2>Leaderboard</h2>"+
    "<p><b>Which team are you?</b></p>"+
    "<select onchange='selectTeam(this.value)'>"+options+"</select>";

  const myIndex=myTeam ? teamIndex(myTeam) : -1;

  if(myIndex>=0){
    const first=Math.max(0,myIndex-3);
    const last=myIndex-1;

    if(last>=first){
      html+=
        "<div class='notice'><b>You are #"+(myIndex+1)+" "+myTeam.name+
        ".</b> You may challenge ranks #"+(first+1)+" through #"+(last+1)+".</div>";
    }else{
      html+="<div class='notice'><b>You are ranked #1.</b> There is nobody above you to challenge.</div>";
    }
  }

  html+=
    "<table>"+
    "<tr><th>Rank</th><th>Team</th><th>Combined DUPR</th><th>W-L</th><th></th></tr>";

  teams.forEach((team,i)=>{

    const eligible =
      myIndex>=0 &&
      i<myIndex &&
      i>=myIndex-3;

    const mine=team===myTeam;

    const challengeBusy =
      challenge &&
      ["Pending","Accepted","Awaiting Confirmation"].includes(challenge.status);

    html+=
      "<tr class='"+(i<10?"top10 ":"")+(mine?"myteam":"")+"'>"+
      "<td><b>#"+(i+1)+"</b></td>"+
      "<td><b>"+team.name+"</b><div class='muted'>"+team.players+"</div></td>"+
      "<td>"+team.dupr.toFixed(2)+"</td>"+
      "<td>"+team.wins+"-"+team.losses+"</td>"+
      "<td>";

    if(eligible && !challengeBusy){
      html+=
        "<button class='challengeBtn' onclick='issueChallenge("+i+")'>Challenge</button>";
    }else if(mine){
      html+="<span class='muted'>Your team</span>";
    }

    html+="</td></tr>";
  });

  html+="</table>";

  c.innerHTML=html;
}

function selectTeam(value){

  if(value===""){
    myTeam=null;
  }else{
    myTeam=teams[parseInt(value)];
  }

  renderBoard();
}

function issueChallenge(opponentIndex){

  if(!myTeam) return;

  const myIndex=teamIndex(myTeam);
  const distance=myIndex-opponentIndex;

  if(distance<1 || distance>3){
    alert("That team is outside the 3-position challenge limit.");
    return;
  }

  challenge={
    challenger:myTeam,
    challenged:teams[opponentIndex],
    status:"Pending",
    submittedBy:null,
    scores:null,
    winner:null
  };

  renderChallenges();
}

function renderChallenges(){

  const c=document.getElementById("content");

  if(!myTeam){
    c.innerHTML=
      "<h2>My Challenges</h2>"+
      "<p>Please select your team from the Leaderboard first.</p>";
    return;
  }

  if(!challenge){
    c.innerHTML=
      "<h2>My Challenges</h2>"+
      "<p>No active challenges yet.</p>"+
      "<p class='muted'>Select your team on the Leaderboard, then challenge a team up to 3 positions above.</p>";
    return;
  }

  if(myTeam!==challenge.challenger && myTeam!==challenge.challenged){
    c.innerHTML=
      "<h2>My Challenges</h2>"+
      "<p>No active challenge involving this team.</p>";
    return;
  }

  const challengerRank=teamIndex(challenge.challenger)+1;
  const challengedRank=teamIndex(challenge.challenged)+1;

  if(challenge.status==="Pending"){

    if(myTeam===challenge.challenger){
      c.innerHTML=
        "<h2>My Challenges</h2>"+
        "<div class='success'>"+
        "<b>Outgoing Challenge</b><br><br>"+
        "#"+challengerRank+" "+challenge.challenger.name+
        " has challenged #"+challengedRank+" "+challenge.challenged.name+
        ".<br><br><b>Status:</b> Pending"+
        "</div>"+
        "<p class='muted'>Waiting for the challenged team to accept or decline.</p>";
      return;
    }

    c.innerHTML=
      "<h2>My Challenges</h2>"+
      "<div class='warning'>"+
      "<b>Incoming Challenge</b><br><br>"+
      "#"+challengerRank+" "+challenge.challenger.name+
      " has challenged your team, #"+challengedRank+" "+challenge.challenged.name+"."+
      "</div>"+
      "<div class='actionRow'>"+
      "<button class='acceptBtn smallBtn' onclick='acceptChallenge()'>Accept Challenge</button>"+
      "<button class='declineBtn smallBtn' onclick='declineChallenge()'>Decline Challenge</button>"+
      "</div>";
    return;
  }

  if(challenge.status==="Accepted"){
    c.innerHTML=
      "<h2>My Challenges</h2>"+
      "<div class='success'>"+
      "<b>Challenge Accepted</b><br><br>"+
      challenge.challenged.name+" accepted the challenge from "+challenge.challenger.name+
      ".<br><br><b>Status:</b> Accepted"+
      "</div>"+
      "<p>The match must be played within 7 days.</p>"+
      "<button onclick='show(\"score\")'>Enter Match Result</button>";
    return;
  }

  if(challenge.status==="Declined"){
    c.innerHTML=
      "<h2>My Challenges</h2>"+
      "<div class='warning'><b>Challenge Declined</b><br><br>"+
      challenge.challenged.name+" declined the challenge from "+challenge.challenger.name+
      ".<br><br><b>Reason:</b> "+challenge.declineReason+"</div>"+
      "<button onclick='clearChallenge()'>Close Challenge</button>";
    return;
  }

  if(challenge.status==="Awaiting Confirmation"){

    if(myTeam===challenge.submittedBy){
      c.innerHTML=
        "<h2>My Challenges</h2>"+
        "<div class='warning'><b>Result Submitted</b><br><br>"+
        scoreSummary()+
        "<br><br><b>Status:</b> Waiting for opponent confirmation.</div>";
      return;
    }

    c.innerHTML=
      "<h2>My Challenges</h2>"+
      "<div class='warning'><b>Result Awaiting Your Confirmation</b><br><br>"+
      scoreSummary()+
      "</div>"+
      "<div class='actionRow'>"+
      "<button class='acceptBtn smallBtn' onclick='confirmResult()'>Confirm Result</button>"+
      "<button class='disputeBtn smallBtn' onclick='disputeResult()'>Dispute Result</button>"+
      "</div>";
    return;
  }

  if(challenge.status==="Completed"){
    c.innerHTML=
      "<h2>My Challenges</h2>"+
      "<div class='success'><b>Match Confirmed</b><br><br>"+
      challenge.winner.name+" won the match.<br><br>"+
      "The leaderboard and W-L records have been updated."+
      "</div>"+
      "<button onclick='show(\"board\")'>View Leaderboard</button>";
    return;
  }

  if(challenge.status==="Disputed"){
    c.innerHTML=
      "<h2>My Challenges</h2>"+
      "<div class='warning'><b>Result Disputed</b><br><br>"+
      "The opposing team did not confirm the submitted result. No standings were changed."+
      "</div>"+
      "<button onclick='resetResult()'>Re-enter Result</button>";
  }
}

function acceptChallenge(){
  challenge.status="Accepted";
  renderChallenges();
}

function declineChallenge(){
    const reason = prompt(
        "Why are you declining this challenge?\n\n" +
        "1 - Scheduling conflict\n" +
        "2 - Injury / illness\n" +
        "3 - Away / unavailable\n" +
        "4 - Other"
    );

    if(reason === null) return;

    let declineReason = "";

    if(reason === "1"){
        declineReason = "Scheduling conflict";
    } else if(reason === "2"){
        declineReason = "Injury / illness";
    } else if(reason === "3"){
        declineReason = "Away / unavailable";
    } else if(reason === "4"){
        declineReason = prompt("Please enter the reason:") || "Other";
    } else {
        alert("Please enter 1, 2, 3, or 4.");
        return;
    }

    challenge.status = "Declined";
    challenge.declineReason = declineReason;
    renderChallenges();
}

function clearChallenge(){
  challenge=null;
  show("board");
}

function renderScore(){

  const c=document.getElementById("content");

  if(!myTeam){
    c.innerHTML="<h2>Enter Score</h2><p>Please select your team first.</p>";
    return;
  }

  if(!challenge || challenge.status!=="Accepted"){
    c.innerHTML=
      "<h2>Enter Score</h2>"+
      "<p>There is no accepted challenge ready for score entry.</p>";
    return;
  }

  if(myTeam!==challenge.challenger && myTeam!==challenge.challenged){
    c.innerHTML=
      "<h2>Enter Score</h2>"+
      "<p>This team is not part of the accepted challenge.</p>";
    return;
  }

  c.innerHTML=
    "<h2>Enter Score</h2>"+
    "<div class='notice'><b>"+challenge.challenger.name+
    " vs. "+challenge.challenged.name+"</b><br>"+
    "Best 2 of 3 games to 11, win by 2.</div>"+

    "<table class='scoreTable'>"+
    "<tr><th>Game</th><th>"+challenge.challenger.name+"</th><th>"+challenge.challenged.name+"</th></tr>"+

    "<tr><td>Game 1</td>"+
    "<td><input id='g1a' type='number' min='0'></td>"+
    "<td><input id='g1b' type='number' min='0'></td></tr>"+

    "<tr><td>Game 2</td>"+
    "<td><input id='g2a' type='number' min='0'></td>"+
    "<td><input id='g2b' type='number' min='0'></td></tr>"+

    "<tr><td>Game 3</td>"+
    "<td><input id='g3a' type='number' min='0' placeholder='If needed'></td>"+
    "<td><input id='g3b' type='number' min='0' placeholder='If needed'></td></tr>"+
    "</table>"+

    "<p class='muted'>Game 3 is only required if the teams split the first two games.</p>"+
    "<button onclick='submitResult()'>Submit Result</button>";
}

function validGame(a,b){

  if(!Number.isInteger(a) || !Number.isInteger(b)) return false;
  if(a<0 || b<0) return false;
  if(a===b) return false;

  const winner=Math.max(a,b);
  const loser=Math.min(a,b);

  if(winner<11) return false;
  if(winner-loser<2) return false;

  return true;
}

function submitResult(){

  const g1a=parseInt(document.getElementById("g1a").value);
  const g1b=parseInt(document.getElementById("g1b").value);
  const g2a=parseInt(document.getElementById("g2a").value);
  const g2b=parseInt(document.getElementById("g2b").value);

  if(!validGame(g1a,g1b) || !validGame(g2a,g2b)){
    alert("Please enter valid scores for Games 1 and 2. Each game must be won by at least 2 points.");
    return;
  }

  let challengerGames=0;
  let challengedGames=0;

  if(g1a>g1b) challengerGames++;
  else challengedGames++;

  if(g2a>g2b) challengerGames++;
  else challengedGames++;

  let scores=[
    [g1a,g1b],
    [g2a,g2b]
  ];

  if(challengerGames===1 && challengedGames===1){

    const g3a=parseInt(document.getElementById("g3a").value);
    const g3b=parseInt(document.getElementById("g3b").value);

    if(!validGame(g3a,g3b)){
      alert("The teams split Games 1 and 2, so please enter a valid Game 3 score.");
      return;
    }

    scores.push([g3a,g3b]);

    if(g3a>g3b) challengerGames++;
    else challengedGames++;
  }

  challenge.scores=scores;
  challenge.winner=
    challengerGames>challengedGames
      ? challenge.challenger
      : challenge.challenged;

  challenge.submittedBy=myTeam;
  challenge.status="Awaiting Confirmation";

  renderChallenges();
}

function scoreSummary(){

  let html="<b>Submitted scores:</b><br>";

  challenge.scores.forEach((score,i)=>{
    html+="Game "+(i+1)+": "+
      challenge.challenger.name+" "+score[0]+
      " - "+score[1]+" "+challenge.challenged.name+"<br>";
  });

  html+="<br><b>Reported winner:</b> "+challenge.winner.name;

  return html;
}

function confirmResult(){

  updateRecordsAndLadder();
  challenge.status="Completed";
  renderChallenges();
}

function disputeResult(){
  challenge.status="Disputed";
  renderChallenges();
}

function resetResult(){
  challenge.scores=null;
  challenge.winner=null;
  challenge.submittedBy=null;
  challenge.status="Accepted";
  show("score");
}

function updateRecordsAndLadder(){

  const winner=challenge.winner;
  const loser=
    winner===challenge.challenger
      ? challenge.challenged
      : challenge.challenger;

  winner.wins++;
  loser.losses++;

  if(winner===challenge.challenger){

    const challengerIndex=teamIndex(challenge.challenger);
    const challengedIndex=teamIndex(challenge.challenged);

    const movingTeam=teams.splice(challengerIndex,1)[0];
    teams.splice(challengedIndex,0,movingTeam);
  }
}
function renderPartners(){
  const c = document.getElementById("content");

  c.innerHTML =
    "<h2>🤝 Partner Connect</h2>" +
    "<p>Need a partner? Find players who are looking to form a team.</p>" +

    "<div class='info'>" +
      "<b>Which ladder are you interested in?</b><br><br>" +

      "<select id='partnerLadder' style='width:100%;padding:12px;font-size:16px;'>" +
        "<option value='mens'>Men's Ladder</option>" +
        "<option value='womens'>Women's Ladder</option>" +
        "<option value='mixed'>Mixed Ladder</option>" +
      "</select>" +
    "</div>" +

    "<br>" +

    "<h3>Players Looking for Partners</h3>" +

(partnerListings.length === 0
  ? "<div class='warning'><b>No players are currently looking for a partner.</b></div>"
: partnerListings.map(function(player,index){
  return "<div class='success'>" +
    "<b>" + player.name + "</b><br>" +
    "Gender: " + player.gender + "<br>" +
    "DUPR: " + player.dupr + "<br>" +
    "Looking for: " + player.ladder + "<br>" +
    "Availability: " + player.availability + "<br><br>" +
    "<button class='smallBtn' onclick='sendPartnerInvite(" + index + ")'>" +
      "🤝 Invite as Partner" +
    "</button>" +
  "</div><br>";
}).join("")
) +

    "<br>" +

"<h3>Pending Partner Invites</h3>" +

(
 partnerInvites.filter(function(invite){ return invite.status === "Pending"; }).length === 0
  ? "<div class='warning'><b>No pending partner invites.</b></div>"
  : partnerInvites.map(function(invite,index){
  if(invite.status !== "Pending") return "";
      return "<div class='success'>" +
        "<b>From:</b> " + invite.from + "<br>" +
        "<b>To:</b> " + invite.to + "<br>" +
        "<b>Status:</b> " + invite.status + "<br><br>" +

        (invite.status === "Pending"
          ? "<button class='smallBtn' onclick='acceptPartnerInvite(" + index + ")'>Accept</button> " +
            "<button class='smallBtn' onclick='declinePartnerInvite(" + index + ")'>Decline</button>"
          : ""
        ) +

      "</div><br>";
    }).join("")
) +

"<br>" +
    
    "<button onclick='renderPartnerForm()'>" +
      "➕ List Me as Looking for a Partner" +
    "</button>";
}

function renderPartnerForm(){

  const c = document.getElementById("content");

  c.innerHTML =
    "<h2>🤝 Looking for a Partner</h2>" +
    "<p>Add yourself to the Partner Connect list.</p>" +

    "<p><b>Name</b><br>" +
    "<input id='partnerName' placeholder='Your name' style='width:100%;padding:10px;'></p>" +

    "<p><b>Gender</b><br>" +
    "<select id='partnerGender' style='width:100%;padding:10px;'>" +
      "<option value='Male'>Male</option>" +
      "<option value='Female'>Female</option>" +
    "</select></p>" +

    "<p><b>DUPR</b><br>" +
    "<input id='partnerDupr' type='number' step='0.01' placeholder='Example: 4.25' style='width:100%;padding:10px;'></p>" +

    "<p><b>Looking for</b><br>" +
    "<select id='partnerLadder' style='width:100%;padding:10px;'>" +
      "<option value='mens'>Men's Ladder</option>" +
      "<option value='womens'>Women's Ladder</option>" +
      "<option value='mixed'>Mixed Ladder</option>" +
    "</select></p>" +

    "<p><b>Availability</b><br>" +
    "<input id='partnerAvailability' placeholder='Example: Weekday mornings' style='width:100%;padding:10px;'></p>" +

    "<button onclick='savePartnerListing()'>Add Me to Partner Connect</button> " +
    "<button onclick='renderPartners()'>Cancel</button>";
}

  function savePartnerListing(){
  const name = document.getElementById("partnerName").value.trim();
  const gender = document.getElementById("partnerGender").value;
  const dupr = document.getElementById("partnerDupr").value;
  const ladder = document.getElementById("partnerLadder").value;
  const availability = document.getElementById("partnerAvailability").value.trim();

  if(!name || !dupr || !availability){
    alert("Please complete your name, DUPR and availability.");
    return;
  }

  partnerListings.push({
    name: name,
    gender: gender,
    dupr: dupr,
    ladder: ladder,
    availability: availability
  });

  renderPartners();
}
function sendPartnerInvite(index){
  const player = partnerListings[index];

  if(!player){
    alert("Player not found.");
    return;
  }

  const senderName = prompt("Enter your name to send this partner invite:");
const senderGender = prompt("Enter your gender: Male or Female");
if(senderGender === null) return;
  

const senderDupr = prompt("Enter your DUPR, or type NR if you are not rated:");
if(senderDupr === null) return;

if(senderName === null) return;



  if(senderName.trim() === ""){
    alert("Please enter your name.");
    return;
  }

partnerInvites.push({
  from: senderName.trim(),

function acceptPartnerInvite(index){
  const invite = partnerInvites[index];

  if(!invite){
    alert("Invite not found.");
    return;
  }

  invite.status = "Accepted";
  const senderIsNR = invite.fromDupr.toUpperCase() === "NR";
const partnerIsNR = String(invite.toDupr).toUpperCase() === "NR";
const teamIsNR = senderIsNR || partnerIsNR;

const combinedDupr = teamIsNR
  ? "NR"
  : (parseFloat(invite.fromDupr) + parseFloat(invite.toDupr)).toFixed(2);

createdTeams.push({
  name: invite.from + " / " + invite.to,
  players: invite.from + " / " + invite.to,
  player1Gender: invite.fromGender,
player2Gender: invite.toGender,
  ladder: invite.ladder,
  dupr: combinedDupr,
  isNR: teamIsNR,
  wins: 0,
  losses: 0
});
  placeNewTeamByDupr();
partnerListings = partnerListings.filter(function(player){
  return player.name !== invite.to;
});
  

  alert(
    invite.to + " accepted the partner invite from " + invite.from + "."
  );

  renderPartners();
}

function declinePartnerInvite(index){
  const invite = partnerInvites[index];

  if(!invite){
    alert("Invite not found.");
    return;
  }

  invite.status = "Declined";

  alert(
    invite.to + " declined the partner invite from " + invite.from + "."
  );

  renderPartners();
}
  
show("board");
