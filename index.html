function placeNewTeamByDupr(){
  const newTeam = createdTeams[createdTeams.length - 1];

  if(!newTeam) return;

  newTeam.ladder = newTeam.ladder || currentLadder || "mens";

  const ladderTeams = getLadderTeams(newTeam.ladder);

  function placeAtBottom(){
    if(ladderTeams.length === 0){
      teams.push(newTeam);
      return;
    }

    const lastTeam = ladderTeams[ladderTeams.length - 1];
    teams.splice(teamIndex(lastTeam) + 1, 0, newTeam);
  }

  // NR teams always enter at the bottom of their selected ladder.
  if(newTeam.isNR){
    placeAtBottom();
    return;
  }

  const newDupr = parseFloat(newTeam.dupr);
  let teamToPlaceBefore = null;

  // Position 11 is index 10 within this specific ladder.
  // A new team's DUPR can never place it inside the Top 10.
  for(let i = 10; i < ladderTeams.length; i++){
    const existingDupr = parseFloat(ladderTeams[i].dupr);

    if(!isNaN(existingDupr) && newDupr > existingDupr){
      teamToPlaceBefore = ladderTeams[i];
      break;
    }
  }

  if(teamToPlaceBefore){
    teams.splice(teamIndex(teamToPlaceBefore), 0, newTeam);
  }else{
    placeAtBottom();
  }

function eligibleChallengeIndexes(team){
  if(!team || isTeamAway(team)){
    return [];
  }

  const teamLadder = team.ladder || "mens";
  const ladderTeams = getLadderTeams(teamLadder);
  const myLadderIndex = ladderTeams.indexOf(team);

  if(myLadderIndex < 0){
    return [];
  }

  const eligibleIndexes = [];
  let availableTeamsFound = 0;

  for(let i = myLadderIndex - 1; i >= 0; i--){
    const opponent = ladderTeams[i];

    if(isTeamAway(opponent)){
      continue;
    }

    availableTeamsFound++;

    const limit =
      (myLadderIndex < 10 || i < 10) ? 2 : 3;

    if(availableTeamsFound <= limit){
      eligibleIndexes.push(teamIndex(opponent));
    }

    if(availableTeamsFound >= 3){
      break;
    }
  }

  return eligibleIndexes;
}

  function restoreChallengeTeamReferences(items){
  if(!Array.isArray(items)) return [];

  return items.map(function(item){
    return {
      ...item,
      challenger: findTeamFromSavedValue(item.challenger),
      challenged: findTeamFromSavedValue(item.challenged),
      winner: findTeamFromSavedValue(item.winner),
      submittedBy: findTeamFromSavedValue(item.submittedBy)
    };
  }).filter(function(item){
    return item.challenger && item.challenged;
  });
}
  function findTeamFromSavedValue(value){
  if(!value) return null;

  const teamName =
    typeof value === "string"
      ? value
      : value.name;

  return teams.find(function(team){
    return team.name === teamName;
  }) || null;
}
function captureTeamRanks(){
  return teams.map(function(team){
    const teamLadder = team.ladder || "mens";
    const ladderTeams = getLadderTeams(teamLadder);

    return {
      team: team,
      ladder: teamLadder,
      rank: ladderTeams.indexOf(team) + 1
    };
  });
}

function recordLadderMovements(previousRanks,reason){
  previousRanks.forEach(function(item){
    if(!teams.includes(item.team)){
      return;
    }

    const ladderTeams = getLadderTeams(
      item.ladder || item.team.ladder || "mens"
    );

    const newIndex = ladderTeams.indexOf(item.team);

    if(newIndex === -1){
      return;
    }

    const newRank = newIndex + 1;

    if(newRank !== item.rank){
      ladderMovementHistory.push({
        team: item.team.name,
        ladder: item.ladder || item.team.ladder || "mens",
        fromRank: item.rank,
        toRank: newRank,
        reason: reason,
        changedAt: Date.now()
      });
    }
  });
}

async function adminAddTeam(){
  if(!isAdmin()){
    alert("Only Admin can add a team directly.");
    return;
  }

  const ladderNames = {
    mens: "Men's Ladder",
    womens: "Women's Ladder",
    mixed: "Mixed Ladder"
  };

  const teamName = prompt(
    "Enter the team name for the " + ladderNames[currentLadder] + ":"
  );

  if(teamName === null || teamName.trim() === ""){
    return;
  }

  const duplicateName = teams.some(function(team){
    return team.name.toLowerCase() === teamName.trim().toLowerCase();
  });

  if(duplicateName){
    alert("That team name is already being used.");
    return;
  }

  const playerOne = prompt("Enter the first player's name:");
  if(playerOne === null || playerOne.trim() === ""){
    return;
  }

  const playerTwo = prompt("Enter the second player's name:");
  if(playerTwo === null || playerTwo.trim() === ""){
    return;
  }

  const playerOneDupr = prompt(
    "Enter " + playerOne.trim() + "'s DUPR, or type NR:"
  );
  if(playerOneDupr === null) return;

  const playerTwoDupr = prompt(
    "Enter " + playerTwo.trim() + "'s DUPR, or type NR:"
  );
  if(playerTwoDupr === null) return;

  const firstIsNR =
    playerOneDupr.trim().toUpperCase() === "NR";

  const secondIsNR =
    playerTwoDupr.trim().toUpperCase() === "NR";

  const teamIsNR = firstIsNR || secondIsNR;

  if(
    !teamIsNR &&
    (
      isNaN(parseFloat(playerOneDupr)) ||
      isNaN(parseFloat(playerTwoDupr))
    )
  ){
    alert("Please enter a valid DUPR or NR for each player.");
    return;
  }

  const combinedDupr = teamIsNR
    ? "NR"
    : (
        parseFloat(playerOneDupr) +
        parseFloat(playerTwoDupr)
      ).toFixed(2);

  const newTeam = {
    name: teamName.trim(),
    players: playerOne.trim() + " / " + playerTwo.trim(),
    ladder: currentLadder,
    dupr: combinedDupr,
    isNR: teamIsNR,
    wins: 0,
    losses: 0,
    memberUserIds: [],

function expireOldChallenges(){

  const now = Date.now();
  let stateChanged = false;

  pendingChallenges.forEach(item => {

    // Pending challenge: 72 hours to respond
    if(
      item.status === "Pending" &&
      item.createdAt &&
      now - item.createdAt >= 72 * 60 * 60 * 1000
    ){
      item.status = "Decline Pending Admin Review";
      stateChanged = true;
      item.declineReason = "No response within 72 hours.";
      item.declinedAt = now;

      const historyItem = challengeHistory.findLast(history =>
        history.challenger === item.challenger.name &&
        history.challenged === item.challenged.name &&
        history.status === "Pending"
      );

      if(historyItem){
        historyItem.status = "Decline Pending Admin Review";
        historyItem.declineReason = item.declineReason;
        historyItem.declinedAt = now;
      }
    }

    // Accepted challenge: 7 days to play
    if(
      item.status === "Accepted" &&
      item.acceptedAt &&
      now - item.acceptedAt >= 7 * 24 * 60 * 60 * 1000
    ){
      item.status = "Overdue";
      stateChanged = true;

      const historyItem = challengeHistory.findLast(history =>
        history.challenger === item.challenger.name &&
        history.challenged === item.challenged.name &&
        history.status === "Accepted"
      );

      if(historyItem){
        historyItem.status = "Overdue";

function validGame(a,b){

  if(!Number.isInteger(a) || !Number.isInteger(b)) return false;
  if(a<0 || b<0) return false;
  if(a===b) return false;

  const winner=Math.max(a,b);
  const loser=Math.min(a,b);

  if(winner<11) return false;
  if(winner-loser<2) return false;

  return true;
}

async function submitResult(){
  if(!currentUser){
    alert("Please sign in before submitting a result.");
    return;
  }

  if(!canManageTeam(myTeam)){
    alert("Your account is not assigned to this team.");
    return;
  }

  if(
    !challenge ||
    challenge.status !== "Accepted" ||
    (challenge.challenger !== myTeam && challenge.challenged !== myTeam)
  ){
    alert("No accepted match was found for your team.");
    return;
  }
  const g1a=parseInt(document.getElementById("g1a").value);
  const g1b=parseInt(document.getElementById("g1b").value);
  const g2a=parseInt(document.getElementById("g2a").value);
  const g2b=parseInt(document.getElementById("g2b").value);
  const g3a=parseInt(document.getElementById("g3a").value);
  const g3b=parseInt(document.getElementById("g3b").value);

  if(!validGame(g1a,g1b) || !validGame(g2a,g2b) || !validGame(g3a,g3b)){
    alert("Please enter valid scores for Games 1, 2 and 3. Each game must be played to at least 11 and won by 2.");
    return;
  }

let challengerGames=0;
let challengedGames=0;


  const scores=[
    [g1a,g1b],
    [g2a,g2b],
    [g3a,g3b]
  ];

  if(g1a>g1b) challengerGames++;
  else challengedGames++;

  if(g2a>g2b) challengerGames++;
  else challengedGames++;

  if(g3a>g3b) challengerGames++;
  else challengedGames++;

  if(challengerGames<3 && challengedGames<3){

    const g4a=parseInt(document.getElementById("g4a").value);
    const g4b=parseInt(document.getElementById("g4b").value);

    if(!validGame(g4a,g4b)){
      alert("Game 4 is required because neither team has won 3 games.");
      return;
    }

    scores.push([g4a,g4b]);

    if(g4a>g4b) challengerGames++;
    else challengedGames++;
  }

  if(challengerGames<3 && challengedGames<3){

    const g5a=parseInt(document.getElementById("g5a").value);
    const g5b=parseInt(document.getElementById("g5b").value);

    if(!validGame(g5a,g5b)){
      alert("Game 5 is required because the match is tied 2-2.");
      return;
    }

    scores.push([g5a,g5b]);

    if(g5a>g5b) challengerGames++;
    else challengedGames++;
  }

  challenge.scores=scores;

  challenge.winner=
    challengerGames>challengedGames
      ? challenge.challenger
      : challenge.challenged;

  challenge.submittedBy=myTeam;
  challenge.status="Awaiting Confirmation";

   const saved = await saveLadderState();

  if(!saved){
    await loadLadderState();

  renderChallenges();
}

function updateRecordsAndLadder(){
const previousRanks = captureTeamRanks();
  const winner=challenge.winner;
  const loser=
    winner===challenge.challenger
      ? challenge.challenged
      : challenge.challenger;

  winner.wins++;
  loser.losses++;

  if(winner===challenge.challenger){

    const challengerIndex=teamIndex(challenge.challenger);
    const challengedIndex=teamIndex(challenge.challenged);

    const movingTeam=teams.splice(challengerIndex,1)[0];
    teams.splice(challengedIndex,0,movingTeam);
  }
  recordLadderMovements(previousRanks,"Match result");
  cancelInvalidPendingChallenges();
}
function cancelInvalidPendingChallenges(){

  const now = Date.now();

  pendingChallenges.forEach(item => {

    if(item.status !== "Pending") return;

    const challengerIndex = teamIndex(item.challenger);
    const challengedIndex = teamIndex(item.challenged);

    if(challengerIndex === -1 || challengedIndex === -1) return;

    const distance = challengerIndex - challengedIndex;

    // Top 10, or challenging into the Top 10 = maximum 2 positions.
    // Below the Top 10 = maximum 3 positions.
    const maxChallengeDistance =
      (challengerIndex < 10 || challengedIndex < 10) ? 2 : 3;

    if(distance < 1 || distance > maxChallengeDistance){

      item.status = "Cancelled";

      const historyItem = challengeHistory.findLast(history =>
        history.challenger === item.challenger.name &&
        history.challenged === item.challenged.name &&
        history.status === "Pending"
      );

      if(historyItem){
        historyItem.status = "Cancelled";
        historyItem.cancelledAt = now;
        historyItem.cancelReason =
          "Ranking changed — challenge is now outside the allowed range.";
      }
    }
  });
}

        "style='width:100%;padding:12px;font-size:16px;'>" +
        "<option value='mens' " +
          (currentLadder === "mens" ? "selected" : "") +
          ">Men's Ladder</option>" +
        "<option value='womens' " +
          (currentLadder === "womens" ? "selected" : "") +
          ">Women's Ladder</option>" +
        "<option value='mixed' " +
          (currentLadder === "mixed" ? "selected" : "") +
          ">Mixed Ladder</option>" +
      "</select>" +
    "</div>" +

    "<br>" +
    "<h3>Players Looking for Partners</h3>" +

    (
      visibleListings.length === 0
        ? "<div class='warning'><b>No players are currently looking for a partner in this ladder.</b></div>"
        : visibleListings.map(function(entry){
            const player = entry.player;
            const index = entry.index;

            const canInvite =
              currentUser &&
              (!player.userId || player.userId !== currentUser.id);

            const inviteButton = canInvite
              ? "<button class='smallBtn' onclick='sendPartnerInvite(" +
                  index +
                ")'>🤝 Invite as Partner</button>"
              : currentUser
                ? "<button class='declineBtn smallBtn' onclick='removePartnerListing(" +
                    index +
                  ")'>Remove My Listing</button>"
                : "<span class='muted'>Sign in to send an invitation.</span>";

            return "<div class='success'>" +
              "<b>" + player.name + "</b><br>" +
              "Gender: " + player.gender + "<br>" +
              "DUPR: " + player.dupr + "<br>" +
              "Looking for: " + player.ladder + "<br><br>" +
              inviteButton +
            "</div><br>";
          }).join("")
    ) +

    "<br>" +
    "<h3>Pending Partner Invites</h3>" +

    (
      pendingInvites.length === 0
        ? "<div class='warning'><b>No pending partner invites in this ladder.</b></div>"
        : pendingInvites.map(function(entry){
            const invite = entry.invite;
            const index = entry.index;

            const canRespond =
              currentUser &&
              (!invite.toUserId || invite.toUserId === currentUser.id);

            const canCancel =
              currentUser &&
              (!invite.fromUserId || invite.fromUserId === currentUser.id);

            let inviteActions = "";

            if(canRespond){
              inviteActions +=
                "<button class='smallBtn' onclick='acceptPartnerInvite(" +
                  index +
                ")'>Accept</button> " +
                "<button class='smallBtn' onclick='declinePartnerInvite(" +
                  index +
                ")'>Decline</button> ";
            }

            if(canCancel){
              inviteActions +=
                "<button class='declineBtn smallBtn' onclick='cancelPartnerInvite(" +
                  index +
                ")'>Cancel Invite</button>";
            }

            if(inviteActions === ""){
              inviteActions =
                "<span class='muted'>Waiting for the invited player.</span>";
            }

            return "<div class='success'>" +
              "<b>From:</b> " + invite.from + "<br>" +
              "<b>To:</b> " + invite.to + "<br>" +
              "<b>Status:</b> " + invite.status + "<br><br>" +
              inviteActions +
            "</div><br>";
          }).join("")
    ) +

    "<br>" +

    (
      currentUser
        ? "<button onclick='renderPartnerForm()'>" +
            "➕ List Me as Looking for a Partner" +
          "</button>"
        : "<div class='warning'>Sign in to list yourself or contact a partner.</div>"
    );
}

function selectPartnerLadder(value){
  if(!["mens","womens","mixed"].includes(value)){
    return;
  }

  currentLadder = value;
  renderPartners();
}
  
async function removePartnerListing(index){
  if(!currentUser){
    alert("Please sign in before removing a partner listing.");
    return;
  }

  const player = partnerListings[index];

  if(!player){
    alert("This partner listing could not be found.");
    return;
  }

  if(
    player.userId
      ? player.userId !== currentUser.id
      : !isAdmin()
  ){
    alert("Only the owner can remove this listing.");
    return;
  }

  if(!confirm("Remove your Partner Connect listing?")){
    return;
  }

  partnerListings.splice(index, 1);

  partnerInvites.forEach(function(invite){
    const belongsToListing =
      invite.status === "Pending" &&
      (
        (player.userId && invite.toUserId === player.userId) ||
        (!player.userId && invite.to === player.name)
      );

    if(belongsToListing){
      invite.status = "Cancelled";
      invite.cancelledAt = Date.now();
      invite.cancelReason = "Partner listing removed.";
    }
  });

  const saved = await saveLadderState();

  if(!saved){
    await loadLadderState();
  }

  renderPartners();
}

  c.innerHTML =

    "<p><b>Name</b><br>" +
    "<input id='partnerName' placeholder='Your name' style='width:100%;padding:10px;'></p>" +

   "<p><b>Gender</b><br>" +
"<select id='partnerGender' style='width:100%;padding:10px;'>" +
  (
    currentLadder === "mens"
      ? "<option value='Male'>Male</option>"
      : currentLadder === "womens"
        ? "<option value='Female'>Female</option>"
        : "<option value='Male'>Male</option>" +

  ) +
"</select></p>" +

    "<p><b>DUPR</b><br>" +
    "<input id='partnerDupr' type='number' step='0.01' placeholder='Example: 4.25' style='width:100%;padding:10px;'></p>" +

    "<p><b>Looking for</b><br>" +
    "<select id='partnerLadder' disabled style='width:100%;padding:10px;'>" +
     "<option value='mens' " +
  (currentLadder === "mens" ? "selected" : "") +
  ">Men's Ladder</option>" +
"<option value='womens' " +
  (currentLadder === "womens" ? "selected" : "") +
  ">Women's Ladder</option>" +
"<option value='mixed' " +
  (currentLadder === "mixed" ? "selected" : "") +
  ">Mixed Ladder</option>" +
    "</select></p>" +

    

    "<button onclick='savePartnerListing()'>Add Me to Partner Connect</button> " +

}

async function savePartnerListing(){
  if(!currentUser){
    alert("Please sign in before listing yourself as looking for a partner.");
    return;
  }

  const name = document.getElementById("partnerName").value.trim();
  const gender = document.getElementById("partnerGender").value;
  const dupr = document.getElementById("partnerDupr").value;
  const ladder = document.getElementById("partnerLadder").value;
if(ladder === "mens" && gender !== "Male"){
  alert("The Men's Ladder is available only to male players.");
  return;
}

if(ladder === "womens" && gender !== "Female"){
  alert("The Women's Ladder is available only to female players.");
  return;
}
  if(!name || !dupr){
    alert("Please complete your name and DUPR.");
    return;
  }

   partnerListings.push({
    name: name,
    gender: gender,
    dupr: dupr,
    ladder: ladder,
    userId: currentUser.id,
    email: currentUser.email
  });

  const saved = await saveLadderState();

  if(!saved){
    await loadLadderState();
  }

  renderPartners();
}
async function sendPartnerInvite(index){
  if(!currentUser){
    alert("Please sign in before sending a partner invitation.");
    return;
  }

  const player = partnerListings[index];

  if(!player){
    alert("Player not found.");
    return;
  }

  if(player.userId && player.userId === currentUser.id){
    alert("You cannot send a partner invitation to your own listing.");
    return;
  }

  const senderName = prompt("Enter your name to send this partner invite:");
  if(senderName === null) return;

  const senderGender = prompt("Enter your gender: Male or Female");
  if(senderGender === null) return;

  const senderDupr = prompt("Enter your DUPR, or type NR if you are not rated");
  if(senderDupr === null) return;

  if(senderName.trim() === ""){
    alert("Please enter your name.");
    return;
  }

  const normalizedSenderGender =
    senderGender.trim().toLowerCase();

  if(
    normalizedSenderGender !== "male" &&
    normalizedSenderGender !== "female"
  ){
    alert("Please enter Male or Female.");
    return;
  }

  const senderGenderDisplay =
    normalizedSenderGender === "male"
      ? "Male"
      : "Female";

  const listingGender =
    String(player.gender).trim().toLowerCase();

  const listingLadder = player.ladder || "mens";

  if(
    listingLadder === "mens" &&
    (
      normalizedSenderGender !== "male" ||
      listingGender !== "male"
    )
  ){
    alert("Men's teams must contain two male players.");
    return;
  }

  if(
    listingLadder === "womens" &&
    (
      normalizedSenderGender !== "female" ||
      listingGender !== "female"
    )
  ){
    alert("Women's teams must contain two female players.");
    return;
  }

  if(
    listingLadder === "mixed" &&
    normalizedSenderGender === listingGender
  ){
    alert("Mixed teams must contain one male and one female player.");
    return;
  }

  const normalizedSenderDupr = senderDupr.trim();

  if(
    normalizedSenderDupr.toUpperCase() !== "NR" &&
    (
      isNaN(parseFloat(normalizedSenderDupr)) ||
      parseFloat(normalizedSenderDupr) <= 0
    )
  ){
    alert("Please enter a valid DUPR or NR.");
    return;
  }

  
  partnerInvites.push({
    from: senderName.trim(),
fromDupr: normalizedSenderDupr,
fromGender: senderGenderDisplay,
    fromUserId: currentUser.id,
    fromEmail: currentUser.email,
    to: player.name,
    toGender: player.gender,
    toDupr: player.dupr,
    toUserId: player.userId || null,
    toEmail: player.email || null,
    ladder: listingLadder,
    status: "Pending",
    createdAt: Date.now()
  });

  const saved = await saveLadderState();

  if(!saved){
    await loadLadderState();
  }

  alert("Partner invite sent to " + player.name + ".");
  renderPartners();
}
async function acceptPartnerInvite(index){
  if(!currentUser){
    alert("Please sign in before accepting a partner invitation.");
    return;
  }

  const invite = partnerInvites[index];

  if(!invite || invite.status !== "Pending"){
    alert("Invite not found.");
    return;
  }

  if(invite.toUserId && invite.toUserId !== currentUser.id){
    alert("Only the invited player can accept this invitation.");
    return;
  }

  const senderIsNR =
    String(invite.fromDupr).toUpperCase() === "NR";
  const partnerIsNR =
    String(invite.toDupr).toUpperCase() === "NR";
  const teamIsNR = senderIsNR || partnerIsNR;

  const combinedDupr = teamIsNR
    ? "NR"
    : (
        parseFloat(invite.fromDupr) +
        parseFloat(invite.toDupr)
      ).toFixed(2);

  const teamName = prompt("Enter your team name:");

  if(teamName === null || teamName.trim() === ""){
    alert("Please enter a team name.");
    return;
  }

  const duplicateTeam = teams.some(function(team){
    return team.name.toLowerCase() === teamName.trim().toLowerCase();
  });

  if(duplicateTeam){
    alert("That team name is already being used.");
    return;
  }

  invite.status = "Accepted";
  invite.acceptedAt = Date.now();

  createdTeams.push({
    name: teamName.trim(),
    players: invite.from + " / " + invite.to,
    player1Gender: invite.fromGender,
    player2Gender: invite.toGender,
    ladder: invite.ladder,
    dupr: combinedDupr,
    isNR: teamIsNR,
    wins: 0,
    losses: 0,
    memberUserIds: [
      invite.fromUserId,
      invite.toUserId
    ].filter(Boolean),
    memberEmails: [
      invite.fromEmail,
      invite.toEmail
    ].filter(Boolean)
  });

 placeNewTeamByDupr();

const newTeam = createdTeams[createdTeams.length - 1];

currentLadder = newTeam.ladder || "mens";
myTeam = newTeam;
  const invitedUserIds = [
    invite.fromUserId,
    invite.toUserId
  ].filter(Boolean);

  partnerListings = partnerListings.filter(function(player){
    return (
      !invitedUserIds.includes(player.userId) &&
      player.name !== invite.to &&
      player.name !== invite.from
    );
  });

  const saved = await saveLadderState();

  if(!saved){
    await loadLadderState();
  }

  alert(
    invite.to + " accepted the partner invite from " + invite.from + "."
  );

  show("board");
}
async function declinePartnerInvite(index){
  if(!currentUser){
    alert("Please sign in before declining a partner invitation.");
    return;
  }

  const invite = partnerInvites[index];

  if(!invite || invite.status !== "Pending"){
    alert("Invite not found.");
    return;
  }

  if(invite.toUserId && invite.toUserId !== currentUser.id){
    alert("Only the invited player can decline this invitation.");
    return;
  }

  invite.status = "Declined";
  invite.declinedAt = Date.now();

  const saved = await saveLadderState();

  if(!saved){
    await loadLadderState();
  }

  alert(
    invite.to + " declined the partner invite from " + invite.from + "."
  );

  renderPartners();
}
async function cancelPartnerInvite(index){
  if(!currentUser){
    alert("Please sign in before cancelling a partner invitation.");
    return;
  }

  const invite = partnerInvites[index];

  if(!invite || invite.status !== "Pending"){
    alert("This partner invitation could not be found.");
    return;
  }

  if(invite.fromUserId && invite.fromUserId !== currentUser.id){
    alert("Only the sender can cancel this invitation.");
    return;
  }

  if(!confirm(invite.from + ", cancel your invitation to " + invite.to + "?")){
    return;
  }

  invite.status = "Cancelled";
  invite.cancelledAt = Date.now();

  const saved = await saveLadderState();

  if(!saved){
    await loadLadderState();
  }

  alert(
    invite.from + " cancelled the partner invitation to " + invite.to + "."
  );

  renderPartners();
}
  
async function startApp(){
  await loadCurrentUser();
await loadLadderState();

if(!currentUser){
  myTeam = null;
}else if(!isAdmin()){
  myTeam = findCurrentUsersTeam();
}

const deadlineChanges = expireOldChallenges();
  if(deadlineChanges && currentUser){
    const saved = await saveLadderState();

    if(!saved){
      await loadLadderState();
    }
  }

  show("board");
}

startApp();
</script>
